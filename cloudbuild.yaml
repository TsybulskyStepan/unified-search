# Cloud Build config: build and push to Artifact Registry, deploy to Cloud Run.
# Usage:
#   gcloud builds submit --region=YOUR_REGION --config=cloudbuild.yaml \
#     --substitutions=_DB_INSTANCE=project:region:instance
#
# Requires:
#   - Cloud SQL PostgreSQL 17 instance with pgvector, pg_trgm, citext extensions
#     (run db/setup/init-db.sh against it first)
#   - Secret Manager secrets: DB_USER, DB_PASSWORD, API_KEY
#   - Optional summaries: add ,_GEMINI_API_KEY_SECRET=GEMINI_API_KEY to --substitutions.
#     Left empty (the default), the secret is not mounted and summaries stay disabled.
#   - Cloud Run service 'unified-search' already created (or let this create it)
steps:
  # Step 1: Build the Docker image and push to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--no-cache"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/unified-search:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/unified-search:latest"
      - "."
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/unified-search:${SHORT_SHA}"
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/unified-search:latest"

  # Step 2: Deploy to Cloud Run
  # A shell wrapper builds the secret list so the optional Gemini secret is mounted only when named.
  # Env vars use one --set-env-vars: gcloud makes it mutually exclusive with --update-env-vars.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        secrets="DB_USER=${_DB_USER_SECRET}:latest,DB_PASSWORD=${_DB_PASSWORD_SECRET}:latest,API_KEY=${_API_KEY_SECRET}:latest"
        if [ -n "${_GEMINI_API_KEY_SECRET}" ]; then
          secrets="$$secrets,GEMINI_API_KEY=${_GEMINI_API_KEY_SECRET}:latest"
        fi
        gcloud run deploy "${_SERVICE_NAME}" \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/unified-search:${SHORT_SHA}" \
          --region="${_REGION}" \
          --platform=managed \
          --allow-unauthenticated \
          --cpu=2 \
          --memory=2Gi \
          --min-instances=1 \
          --max-instances=2 \
          --no-cpu-throttling \
          --concurrency=80 \
          --timeout=300 \
          --ingress=all \
          --set-env-vars="SPRING_PROFILES_ACTIVE=cloudrun,SEED_ENABLED=true,DB_URL=jdbc:postgresql:///${_DB_NAME}?cloudSqlInstance=${_DB_INSTANCE}&socketFactory=com.google.cloud.sql.postgres.SocketFactory&sslmode=disable" \
          --set-secrets="$$secrets"

substitutions:
  _REGION: us-central1
  _REPO: unified-search
  _SERVICE_NAME: unified-search
  _DB_NAME: unified_search
  _DB_INSTANCE: YOUR_PROJECT:YOUR_REGION:YOUR_INSTANCE
  _DB_USER_SECRET: DB_USER
  _DB_PASSWORD_SECRET: DB_PASSWORD
  _API_KEY_SECRET: API_KEY
  _GEMINI_API_KEY_SECRET: ""

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

timeout: 1200s

tags:
  - unified-search
  - cloud-run
