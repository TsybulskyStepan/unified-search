plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'com.diffplug.spotless' version '8.10.2'
}

group = 'com.example.search-app'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

def e5BaseV2Revision = 'f52bf8ec8c7124536f0efb74aca902b2995e5bcd'
def e5BaseV2Resources = layout.buildDirectory.dir('generated-resources/e5-base-v2')

def sha256 = { File file ->
    java.security.MessageDigest digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[8192]
        for (int read; (read = input.read(buffer)) != -1;) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format('%02x', it) }.join()
}

def downloadAndVerify = { String url, File destination, String expectedSha256 ->
    if (destination.exists() && sha256(destination) == expectedSha256) {
        return
    }
    destination.parentFile.mkdirs()
    File temporary = new File(destination.parentFile, destination.name + '.part')
    if (temporary.exists() && sha256(temporary) == expectedSha256) {
        java.nio.file.Files.move(
            temporary.toPath(),
            destination.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
        return
    }
    long existingBytes = temporary.exists() ? temporary.length() : 0
    URLConnection connection = new URL(url).openConnection()
    if (existingBytes > 0) {
        connection.setRequestProperty('Range', "bytes=${existingBytes}-")
    }
    connection.inputStream.withCloseable { input ->
        new FileOutputStream(temporary, existingBytes > 0).withCloseable { output -> output << input }
    }
    if (sha256(temporary) != expectedSha256) {
        throw new GradleException("SHA-256 verification failed for ${destination.name}")
    }
    java.nio.file.Files.move(
        temporary.toPath(),
        destination.toPath(),
        java.nio.file.StandardCopyOption.REPLACE_EXISTING
    )
}

tasks.register('downloadE5BaseV2') {
    def outputDirectory = e5BaseV2Resources.get().asFile
    inputs.property('revision', e5BaseV2Revision)
    outputs.files(
        new File(outputDirectory, 'e5-base-v2.onnx'),
        new File(outputDirectory, 'e5-base-v2-tokenizer.json')
    )
    doLast {
        downloadAndVerify(
            "https://huggingface.co/intfloat/e5-base-v2/resolve/${e5BaseV2Revision}/onnx/model.onnx",
            new File(outputDirectory, 'e5-base-v2.onnx'),
            '157f97ef1957d34f52efa26f8031371bf9043acc45460cec7ebe94631ac0e96b'
        )
        downloadAndVerify(
            "https://huggingface.co/intfloat/e5-base-v2/resolve/${e5BaseV2Revision}/onnx/tokenizer.json",
            new File(outputDirectory, 'e5-base-v2-tokenizer.json'),
            'd241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66'
        )
    }
}

sourceSets.main.resources.srcDir(e5BaseV2Resources)
tasks.named('processResources') {
    dependsOn(tasks.named('downloadE5BaseV2'))
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.0')
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    // ONNX Runtime and the in-process model primitives (§1.4). The pinned E5-base-v2 model and
    // tokenizer are downloaded, checksum-verified, and packaged by processResources.
    implementation 'dev.langchain4j:langchain4j-embeddings:1.20.0-beta30'
    // Binds float[] to the pgvector `vector` column type (§1.4).
    implementation 'com.pgvector:pgvector:0.1.6'
    // Official Google Gen AI SDK, Gemini API mode with a plain API key (§1.4). GeminiSummarizer
    // is the only class that imports it.
    implementation 'com.google.genai:google-genai:1.72.0'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
    testImplementation 'org.testcontainers:postgresql:1.21.3'
}

test {
    useJUnitPlatform()
    // E5-base-v2's 416 MB ONNX graph needs more than Gradle's default 512 MB test heap to load.
    maxHeapSize = '2g'
}

spotless {
    java {
        googleJavaFormat('1.36.1')
    }
}
