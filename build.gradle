plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'com.diffplug.spotless' version '8.10.2'
}

group = 'com.example.search-app'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.0')
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    // In-process MiniLM embedding model (§1.4): the model and tokenizer ship inside this jar,
    // so nothing downloads at first use. Still versioned -beta (latest: 1.20.0-beta30).
    implementation 'dev.langchain4j:langchain4j-embeddings-all-minilm-l6-v2:1.20.0-beta30'
    // Binds float[] to the pgvector `vector` column type (§1.4).
    implementation 'com.pgvector:pgvector:0.1.6'
    // Official Google Gen AI SDK, Gemini API mode with a plain API key (§1.4). GeminiSummarizer
    // is the only class that imports it.
    implementation 'com.google.genai:google-genai:1.72.0'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
    testImplementation 'org.testcontainers:postgresql:1.21.3'
}

test {
    useJUnitPlatform()
}

spotless {
    java {
        googleJavaFormat('1.36.1')
    }
}

/**
 * Installs frontend dependencies (npm ci). Run separately or as part of buildFrontend.
 */
tasks.register('npmInstall', Exec) {
    workingDir = file('frontend')
    commandLine 'sh', '-c', 'npm ci'
}

/**
 * Builds the React frontend via Vite. The output goes to {@code frontend/dist/}.
 */
tasks.register('buildFrontend', Exec) {
    dependsOn('npmInstall')
    workingDir = file('frontend')
    commandLine 'sh', '-c', 'npm run build'
}

// Copy frontend dist into the processed resources so the jar includes the SPA
tasks.named('processResources') {
    dependsOn('buildFrontend')
    from('frontend/dist') {
        into 'static'
    }
}

/**
 * Forces a from-scratch rebuild of the compose images: no layer cache, fresh base images.
 */
tasks.register('composeBuild', Exec) {
    group = 'docker'
    commandLine 'sh', '-c', 'docker compose build --no-cache --pull'
}

/**
 * Rebuilds the images (using layer cache), then recreates the containers and waits until they
 * are healthy. The database volume is kept, so data survives.
 *
 * <p>Usage after changing source code (fast, layer-cached):
 * {@code ./gradlew composeReup}
 *
 * <p>Usage after changing dependencies (slow, no cache):
 * {@code ./gradlew composeBuild && ./gradlew composeReup}
 */
tasks.register('composeReup', Exec) {
    group = 'docker'
    commandLine 'sh', '-c', 'docker compose up -d --build --force-recreate --wait'
}

/**
 * Full from-scratch rebuild: no layer cache, fresh base images, then redeploy.
 */
tasks.register('composeRedeploy', Exec) {
    group = 'docker'
    dependsOn('composeBuild')
    commandLine 'sh', '-c', 'docker compose up -d --force-recreate --wait'
}

/**
 * Starts the dev overlay with hot reload.
 *
 * <p>After the containers are healthy:
 * <ol>
 *   <li>Open {@code http://localhost:5173} — Vite dev server with HMR
 *   <li>Edit frontend files — changes appear instantly
 *   <li>Run {@code ./gradlew compileJava} — Devtools restarts the backend in ~2s
 * </ol>
 */
tasks.register('composeDev', Exec) {
    group = 'docker'
    commandLine 'sh', '-c', 'docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d --build --force-recreate --wait'
}

/**
 * Recompiles Java and triggers Devtools restart inside the running dev container.
 * Run this after changing backend source code.
 */
tasks.register('devCompile', Exec) {
    group = 'docker'
    commandLine 'sh', '-c', './gradlew compileJava'
}
