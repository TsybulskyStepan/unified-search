plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'com.diffplug.spotless' version '8.10.2'
}

group = 'com.example.search-app'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.0')
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    // In-process MiniLM embedding model (§1.4): the model and tokenizer ship inside this jar,
    // so nothing downloads at first use. Still versioned -beta (latest: 1.20.0-beta30).
    implementation 'dev.langchain4j:langchain4j-embeddings-all-minilm-l6-v2:1.20.0-beta30'
    // Binds float[] to the pgvector `vector` column type (§1.4).
    implementation 'com.pgvector:pgvector:0.1.6'
    // Official Google Gen AI SDK, Gemini API mode with a plain API key (§1.4). GeminiSummarizer
    // is the only class that imports it.
    implementation 'com.google.genai:google-genai:1.72.0'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
    testImplementation 'org.testcontainers:postgresql:1.21.3'
}

test {
    useJUnitPlatform()
}

spotless {
    java {
        googleJavaFormat('1.36.1')
    }
}
