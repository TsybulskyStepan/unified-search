# Active on Cloud Run via SPRING_PROFILES_ACTIVE=cloudrun. DB_URL, DB_USER, DB_PASSWORD and the
# Flyway schema come from the service's environment; only pool sizing lives here.
spring:
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 10000

logging:
  level:
    com.google.cloud.sql: WARN
