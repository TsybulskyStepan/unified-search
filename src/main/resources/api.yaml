openapi: 3.1.0
info:
  title: API
  version: 1.0.0
paths:
  /clients:
    post:
      request_body:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email]
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                description:
                  type: string
                social_links:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}/documents:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      request_body:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title:
                  type: string
                content:
                  type: string
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /search:
    get:
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          headers:
            X-Total-Count:
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientSearchResult"

components:
  schemas:
    Client:
      type: object
      properties:
        id:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        description:
          type: string
        social_links:
          type: array
          items:
            type: string

    Document:
      type: object
      properties:
        id:
          type: string
        client_id:
          type: string
        title:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time

    ClientSearchResult:
      type: object
      required: [type, score, match, client]
      properties:
        type:
          type: string
          enum: [client]
        score:
          type: number
          format: double
        match:
          type: object
          required: [field]
          properties:
            field:
              type: string
              enum: [name, email, description, social_links]
        client:
          $ref: "#/components/schemas/Client"
