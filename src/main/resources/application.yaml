spring:
  application:
    name: unified-search
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/unified_search}
    username: ${DB_USER:unified_search}
    password: ${DB_PASSWORD:unified_search}
  jackson:
    property-naming-strategy: SNAKE_CASE
app:
  api-key: ${API_KEY}
  seed:
    # §11.2/§11.3. DemoSeeder runs after startup when this is true and the client table is empty.
    enabled: ${SEED_ENABLED:true}
  search:
    # E5-base-v2 trial: raw eval scores 0.7680 (lowest positive) and 0.7371 (highest negative),
    # producing the rounded-up midpoint 0.753. The live per-positive-pair top-three gate fails,
    # so this is deliberately a review-only candidate rather than a release setting (§6.4).
    semantic-floor: 0.753
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  structured:
    format:
      console: ecs
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: health
