spring:
  application:
    name: unified-search
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/unified_search}
    username: ${DB_USER:unified_search}
    password: ${DB_PASSWORD:unified_search}
  jackson:
    property-naming-strategy: SNAKE_CASE
app:
  api-key: ${API_KEY}
  search:
    # §6.4. Measured by SemanticFloorEvalTest (ticket 03) over the seed/eval corpus (§12.3): lowest
    # positive-pair cosine score 0.2163, highest negative-query score 0.1308, midpoint 0.17.
    # The live /search integration tests guard the same floor at the API boundary.
    semantic-floor: 0.17
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  structured:
    format:
      console: ecs
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: health
