spring:
  application:
    name: unified-search
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/unified_search}
    username: ${DB_USER:unified_search}
    password: ${DB_PASSWORD:unified_search}
  jackson:
    property-naming-strategy: SNAKE_CASE
app:
  api-key: ${API_KEY}
  seed:
    # §11.2/§11.3. DemoSeeder runs after startup when this is true and the client table is empty.
    enabled: ${SEED_ENABLED:true}
  search:
    # §6.3, §11.3: the midpoint SemanticFloorEvalTest measures; the build fails if this drifts.
    semantic-floor: 0.238
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  structured:
    format:
      console: ecs
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,metrics
      path-mapping:
        health: health
