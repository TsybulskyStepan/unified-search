# Docker Compose overlay for local development with hot reload.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d --wait
#   open http://localhost:5173
#
# - Frontend: Vite dev server with HMR on port 5173, proxies /api to backend
# - Backend: Spring Boot Devtools watches compiled classes and auto-restarts
#
# After starting once, recompile backend classes with:
#   ./gradlew compileJava
# The devtools agent detects the change and restarts the JVM in ~2 seconds.

services:
  app:
    build:
      dockerfile: Dockerfile.dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DEVTOOLS_RESTART_TRIGGER: /workspace/classes
    volumes:
      # Mount compiled classes so Devtools can detect changes
      - ./build/classes/java/main:/workspace/classes:delegated
      - ./build/resources/main:/workspace/resources:delegated
      # Mount frontend source so Vite can serve it with HMR
      - ./frontend:/frontend:delegated
    ports:
      - "5173:5173"

  # Override the db service with a named volume for data persistence
  db:
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
