services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: unified_search
      POSTGRES_USER: unified_search
      POSTGRES_PASSWORD: unified_search
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unified_search -d unified_search"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/unified_search
      DB_USER: unified_search
      DB_PASSWORD: unified_search
      # Dev-only default so `docker compose up` needs no setup (PRD §6, system-design §11.4).
      # Copy .env.example to .env and set your own API_KEY to override it.
      API_KEY: ${API_KEY:-dev-only-insecure-key-do-not-use-in-production-env}
      # §11.2/§11.3: seeds the demo corpus on an empty database. Set to false to start blank.
      SEED_ENABLED: ${SEED_ENABLED:-true}
      # §7.3/§11.2: absent by default, so every requested summary resolves `failed` out of the
      # box. Copy .env.example to .env and set GEMINI_API_KEY to turn summaries on.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # §11.2: model ids are retired on Google's schedule; override without a rebuild if needed.
      SUMMARY_MODEL: ${SUMMARY_MODEL:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12

volumes:
  postgres-data:
